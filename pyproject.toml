[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loanpulse-ml"
version = "0.1.0"
description = "Reproducible loan-performance modeling and surveillance engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.7,<2",
  "xgboost>=3.0,<4",
  "shap>=0.48,<1",
  "joblib>=1.4,<2",
  "PyYAML>=6.0,<7",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
loanpulse-ml = "loanpulse_ml.cli:main"
loanpulse-serve = "loanpulse_ml.service:main"

[tool.setuptools]
package-dir = {"" = "ml/src"}

[tool.setuptools.packages.find]
where = ["ml/src"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
pythonpath = ["ml/src"]
addopts = "-ra"
